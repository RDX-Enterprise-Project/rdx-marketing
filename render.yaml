# Fallback hosting artifact. Secrets are not stored here.
# Production HTTPS intake is the Cloudflare Worker in receiver/.
#
# Buffer credentials are intentionally absent: this surface does not publish.

services:
  - type: web
    name: rdx-marketing-capture
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: RDX_MARKETING_INTAKE_HOST
        value: "0.0.0.0"
      - key: RDX_MARKETING_INTAKE_PORT
        value: "8080"
      - key: RDX_MARKETING_BRIDGE_SECRET
        sync: false
      - key: RDX_MARKETING_DATABASE_URL
        sync: false
