name: RDX Marketing Engine

on:
  schedule:
    # Weekday mornings, before the posting slots in config/cadence.yaml.
    - cron: '15 7 * * 1-5'
      timezone: America/New_York
    # Weekend pass, for the optional Saturday slot and metrics collection.
    - cron: '0 9 * * 6,0'
      timezone: America/New_York
    # Monday weekly report.
    - cron: '30 6 * * 1'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      date:
        description: 'Business date override (YYYY-MM-DD)'
        required: false

concurrency:
  group: rdx-marketing
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Marketing run
        env:
          RDX_MARKETING_DATABASE_URL: ${{ secrets.RDX_MARKETING_DATABASE_URL }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_LINKEDIN: ${{ secrets.BUFFER_CHANNEL_LINKEDIN }}
          BUFFER_CHANNEL_FACEBOOK: ${{ secrets.BUFFER_CHANNEL_FACEBOOK }}
          BUFFER_CHANNEL_INSTAGRAM: ${{ secrets.BUFFER_CHANNEL_INSTAGRAM }}
        run: |
          python -m app.daily_run --json \
            ${{ github.event.inputs.date && format('--date {0}', github.event.inputs.date) || '' }}

      - name: Weekly report
        if: github.event.schedule == '30 6 * * 1'
        env:
          RDX_MARKETING_DATABASE_URL: ${{ secrets.RDX_MARKETING_DATABASE_URL }}
        run: python -m app.weekly_report --out weekly-marketing.md

      - name: Upload weekly report
        if: github.event.schedule == '30 6 * * 1'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-marketing
          path: weekly-marketing.md
          if-no-files-found: ignore
          retention-days: 180

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Includes the disclosure-boundary and capture-sanitisation tests.
      - run: python -m pytest
