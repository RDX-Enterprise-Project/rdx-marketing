# Publishing cadence.
#
# The cadence describes the *shape* of a good week. It is a target, never an
# obligation: a slot with no qualified content is skipped and recorded as
# skipped. Quality outranks schedule completion, and the weekly report shows
# skipped slots so a quiet week is visible rather than papered over with filler.

version: "2026.08.15"

timezone: "America/New_York"

weekly_plan:
  monday:
    - pillar: cybersecurity_education
      platforms: [linkedin, facebook]
      post_at: "08:30"
  tuesday:
    - pillar: founder_expertise
      platforms: [linkedin]
      post_at: "08:30"
  wednesday:
    # SOAR automation is RDX's core technical subject and now has its own lane
    # rather than being folded into general cybersecurity education.
    - pillar: soar_automation
      platforms: [linkedin, facebook]
      post_at: "09:00"
  thursday:
    - pillar: academy_workforce
      platforms: [linkedin, instagram]
      post_at: "08:30"
  friday:
    # A shared lane. The planner takes whichever of these has approved content
    # waiting, checking them in this order. If both do, the order here is the
    # editorial priority and decides; if neither does, the slot is skipped and
    # recorded, never filled with something from another subject.
    - pillar:
        - rdx_capabilities
        - smallbiz_federal_education
      platforms: [linkedin]
      post_at: "08:30"
  saturday:
    - pillar: founder_expertise
      platforms: [instagram]
      post_at: "10:00"
      optional: true
  sunday: []

# `pillar` accepts a single value or a priority-ordered list. A list makes the
# slot shared: the planner tries each pillar in order and takes the first with
# qualified approved content for that date.
#
# Deliberately NOT week-number alternation. Backlog-aware selection responds to
# the content that actually exists, rather than running capabilities this Friday
# because the calendar says so while federal content waits.
#
# `approved_milestones` has no weekly lane on purpose. A certification or
# partnership is event-driven, and a recurring milestone slot would invite
# manufacturing milestones to fill it.

# Ceilings, so a backlog cannot flood a week.
limits:
  max_posts_per_day: 3
  max_posts_per_week: 10
  min_hours_between_posts_same_platform: 18

# A slot is filled only from content that already satisfies every one of these.
slot_eligibility:
  require_approved: true
  require_classification: true
  require_platform_variant: true
  # Below this, a slot is skipped rather than filled.
  min_body_chars:
    linkedin: 400
    facebook: 200
    instagram: 80
