# Publishing cadence.
#
# The cadence describes the *shape* of a good week. It is a target, never an
# obligation: a slot with no qualified content is skipped and recorded as
# skipped. Quality outranks schedule completion, and the weekly report shows
# skipped slots so a quiet week is visible rather than papered over with filler.

version: "2026.08.15"

timezone: "America/New_York"

weekly_plan:
  monday:
    - pillar: cybersecurity_education
      platforms: [linkedin, facebook]
      post_at: "08:30"
  tuesday:
    - pillar: founder_expertise
      platforms: [linkedin]
      post_at: "08:30"
  wednesday:
    # SOAR automation is RDX's core technical subject and now has its own lane
    # rather than being folded into general cybersecurity education.
    - pillar: soar_automation
      platforms: [linkedin, facebook]
      post_at: "09:00"
  thursday:
    - pillar: academy_workforce
      platforms: [linkedin, instagram]
      post_at: "08:30"
  friday:
    # Capabilities and federal-market education share this lane. A slot names
    # exactly one pillar today, so this is capabilities and federal content
    # accumulates in the backlog until the slot is changed or the planner
    # learns to pick between pillars by backlog depth. See the note below.
    - pillar: rdx_capabilities
      platforms: [linkedin]
      post_at: "08:30"
  saturday:
    - pillar: founder_expertise
      platforms: [instagram]
      post_at: "10:00"
      optional: true
  sunday: []

# NOT YET SUPPORTED: a slot that alternates between pillars, or picks whichever
# pillar has the deepest approved backlog. `pillar` is a single value and the
# planner matches on it exactly. Expressing "capabilities or federal, whichever
# has content waiting" needs a small planner change, not a config change.
#
# Until then Friday is capabilities, and approved federal content stays visible
# as backlog in the weekly report rather than being forced into another
# pillar's slot.

# Ceilings, so a backlog cannot flood a week.
limits:
  max_posts_per_day: 3
  max_posts_per_week: 10
  min_hours_between_posts_same_platform: 18

# A slot is filled only from content that already satisfies every one of these.
slot_eligibility:
  require_approved: true
  require_classification: true
  require_platform_variant: true
  # Below this, a slot is skipped rather than filled.
  min_body_chars:
    linkedin: 400
    facebook: 200
    instagram: 80
